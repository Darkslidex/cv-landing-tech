server {
    listen 80;
    server_name micv.techcam.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression Optimization for extreme performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Browser Caching Headers
    location ~* \.(?:css|js|ico|png|svg|eot|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PDF: servir inline para que el iframe del viewer pueda mostrarlo.
    # El botón "Descargar PDF" del viewer usa el atributo HTML `download`
    # para forzar la descarga del lado cliente cuando el usuario lo elige.
    location ~* \.pdf$ {
        add_header Content-Disposition 'inline';
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache";
    }

    # Security Headers (para HTML y resto)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files/folders (e.g. .git)
    location ~ /\. {
        deny all;
    }
}
